# ----------------------------------------------------------------------------------------------------------------------
# Actuator
# ----------------------------------------------------------------------------------------------------------------------
spring:
  application:
    name: 'integration-test'
  banner:
    location: "classpath:config/banner.txt"
  ssl:
    bundle:
      jks:
        "server":
          reload-on-update: false
          keystore:
            location: "classpath:ssl/bayonet.p12"
            password: "123456"
            type: "PKCS12"
          key:
            alias: "yingzhuo"
            password: "123456"

server:
  ssl:
    enabled: true
    bundle: "server"
  port: 8443

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      show-values: always
    shutdown:
      access: none
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: simple
    build:
      enabled: true
    os:
      enabled: true
    java:
      enabled: true
    ssl:
      enabled: true
    process:
      enabled: true
    defaults:
      enabled: true
  endpoints:
    web:
      base-path: "/actuator"
      exposure:
        include: [ "health", "info", "metrics", "env", "beans" ]
